<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กำลังพาไปหน้าจอง Mana Garden...</title>
<link rel="canonical" href="https://mana-booking.vercel.app/garden/">
<script>
(function () {
  var dest = 'https://mana-booking.vercel.app/garden/';
  var target = dest + (location.search || '') + (location.hash || '');
  document.addEventListener('DOMContentLoaded', function () {
    var link = document.getElementById('redirect-link');
    if (link) link.href = target;
  });
  try { location.replace(target); } catch (e) {}
})();
</script>
<noscript>
<meta http-equiv="refresh" content="0;url=https://mana-booking.vercel.app/garden/">
</noscript>
</head>
<body>

</body>
</html>
